apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "abom.name" . }}-coordinator
  labels: {{- include "abom.labels" . | nindent 4 }}
  {{- with .Values.serviceAccounts.coordinator.annotations }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
# Each worker pool's identity, apart from the others: csi-driver-spiffe names it in each worker's
# certificate, and the coordinator accepts a result only as signed by the pool it granted the work
# to. None is granted anything in the Kubernetes API, and each may hold its own cloud role.
{{- range $pool := fromYamlArray (include "abom.pools" .) }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ include "abom.name" $ }}-{{ $pool.account }}
  labels: {{- include "abom.labels" $ | nindent 4 }}
  {{- with dig $pool.key "annotations" dict $.Values.serviceAccounts }}
  annotations: {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
{{- end }}
