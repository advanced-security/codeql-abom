name: PR Preview
on:
  pull_request_target:

# `pull_request_target` checking out the pull request's own head is the untrusted-checkout shape
# the CodeQL Actions tests use, and the step below interpolates a field an author controls, which
# is the code-injection one. Both are deliberate: this tree is analyzed, never executed.
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Describe the change
        run: echo "Previewing ${{ github.event.pull_request.title }}"
      - uses: actions/cache@v4
        with:
          path: ~/.npm
          key: preview-${{ github.event.pull_request.number }}
      - run: npm run build
