name: Tooling CI
on:
  push:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The local action above, which is a relationship inside one repository rather than across
      # an account boundary.
      - uses: ./.github/actions/setup
      - run: npm test

  publish:
    needs: check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a1b2c3d4e5f60718293a4b5c6d7e8f9012345678
      - uses: actions/upload-artifact@v4
        with:
          path: dist
      - run: npm publish
