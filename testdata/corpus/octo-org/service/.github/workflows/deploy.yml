name: Deploy
on:
  workflow_dispatch:

jobs:
  # A second consumer of the same reusable workflow, so a dependency has more than one dependent
  # and reach is a number rather than a constant.
  release:
    uses: octo-org/app/.github/workflows/release.yml@v1
    with:
      tag: stable

  announce:
    needs: release
    runs-on: ubuntu-latest
    # A job that can write, so the privilege column has something to report. Every job-level
    # column reads zero otherwise, which looks like a measured absence rather than a data set
    # that never contained the shape.
    permissions:
      contents: write
      packages: write
    steps:
      - uses: octo-org/shared-action@v2
      - run: echo deployed
