name: Release Pipeline
on:
  workflow_dispatch:

# Breadth on purpose. The Explorer's default view collapses steps into the workflow that holds
# them, so a data set of seven small repositories drew 11 nodes — below the 20 the force-layout
# assertion needs before it can compare two views at all, which made a real claim unmeasurable
# rather than false. Every action named here is one that exists.
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
      - uses: actions/setup-go@v5
      - uses: actions/setup-java@v4
      - uses: actions/download-artifact@v4
      - uses: actions/github-script@v7
      - run: make dist

  containerize:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: docker/login-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
      - run: echo built

  publish:
    needs: containerize
    runs-on: ubuntu-latest
    steps:
      - uses: softprops/action-gh-release@v2
      - uses: peter-evans/create-pull-request@v7
      - uses: dorny/paths-filter@v3
      - uses: aws-actions/configure-aws-credentials@v4
      - run: echo published
