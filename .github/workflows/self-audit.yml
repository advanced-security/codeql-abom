name: Self Audit

# Runs ABOM against ABOM, in every language ABOM is written in.
#
# Two things at once, deliberately. It audits the code this repository ships against the
# same queries the tool reports on for everyone else, and it exercises the database-creation
# path every upstream expansion depends on -- a path no unit test can cover, because a real
# extractor and a real source tree are the only honest fixture for it.
#
# One job per language rather than one job for all of them. They share nothing, they take minutes
# each, and a single job would report "self audit failed" without saying which language.
#
# `action-pins` at the bottom audits no code at all. It is here because it shares these triggers
# exactly -- including the weekly schedule, for the same reason: an upstream tag can move while
# nothing in this repository changes.

on:
  pull_request:
    paths:
      - '.codeql-version'
      - '.github/**'
      # The whole command tree, not just selfcheck.go: the Go job analyzes the repository from
      # the root, so every file under cmd/ is subject to the suite it runs.
      - 'cmd/**'
      - 'internal/**'
      - 'ql/**'
      - 'scripts/**'
      - 'ui/**'
      - 'go.mod'
  push:
    branches: ['main']
    paths:
      - '.codeql-version'
      - '.github/**'
      - 'cmd/**'
      - 'internal/**'
      - 'ql/**'
      - 'scripts/**'
      - 'ui/**'
      - 'go.mod'
  schedule:
    # Weekly: a query pack update can start flagging code that has not itself changed.
    - cron: '0 7 * * 1'

permissions:
  contents: read

jobs:
  self-audit:
    name: Self Audit - ${{ matrix.name }}
    runs-on: ubuntu-latest

    strategy:
      # Every language is reported, not just the first to fail. A cancelled sibling would hide
      # whether the others were clean, which is the question a red build raises.
      fail-fast: false
      matrix:
        include:
          - name: Actions
            language: actions
            source-root: '.'
            # Named for the same reason every row below names one: without it the run falls back
            # to `runner.DefaultSuite`, which is the corpus attribution suite rather than the
            # gate, and this job then checks something `make selfcheck` never runs.
            suite: 'advanced-security/abom-actions-selfcheck-src:codeql-suites/abom-selfcheck.qls'
            dotnet: false
          - name: Go
            language: go
            source-root: '.'
            suite: 'advanced-security/abom-go-quality-src:codeql-suites/abom-go-quality.qls'
            dotnet: false
          - name: 'C#'
            language: csharp
            source-root: 'ui'
            suite: 'advanced-security/abom-csharp-quality-src:codeql-suites/abom-csharp-quality.qls'
            dotnet: true
          - name: JavaScript
            language: javascript
            # The repository root, because that is what Default Setup reads and what the Code
            # Scanning config's `paths-ignore` is resolved against. A root of `ui/wwwroot` misses
            # `ui/tools`, and a root of `ui` silently drops every exclusion written `ui/...`.
            source-root: '.'
            suite: >-
              advanced-security/abom-javascript-quality-src:codeql-suites/abom-javascript-quality.qls
            dotnet: false
          - name: Python
            language: python
            source-root: 'scripts'
            suite: >-
              advanced-security/abom-python-quality-src:codeql-suites/abom-python-quality.qls
            dotnet: false

    steps:
      - name: Self Audit - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Self Audit - Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # The C# extractor builds the project to read it, so the SDK has to be present before the
      # database is created. Every other language here extracts from source alone.
      - name: Self Audit - Setup .NET
        if: matrix.dotnet
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      - name: Self Audit - Setup CodeQL
        uses: $/.github/actions/setup-codeql

      - name: Self Audit - Analyze our own ${{ matrix.name }}
        # The suite is fetched from the CodeQL registry (ghcr.io) on first use; the CLI reads
        # GITHUB_TOKEN itself to authenticate that pull, same as any other registry client.
        #
        # No --max-findings: the default is zero, and naming it here would be one more place to
        # quietly raise it.
        env:
          GITHUB_TOKEN: ${{ github.token }}
          LANGUAGE: ${{ matrix.language }}
          SOURCE_ROOT: ${{ matrix.source-root }}
          SUITE: ${{ matrix.suite }}
        run: |
          if [ -n "$SUITE" ]; then
            go run ./cmd/codeql-abom selfcheck \
              --language="$LANGUAGE" --source-root="$SOURCE_ROOT" --suite "$SUITE"
          else
            go run ./cmd/codeql-abom selfcheck --source-root="$SOURCE_ROOT"
          fi

      - name: Self Audit - Summary
        if: always()
        env:
          NAME: ${{ matrix.name }}
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## Self Audit - $NAME"
            echo ""
            echo "Result: **$OUTCOME**"
            echo ""
            echo "ABOM's own code-quality suite run against this repository, using ABOM's own"
            echo "database-creation path. The threshold is zero findings."
          } >> "$GITHUB_STEP_SUMMARY"

  # The supply chain the jobs above run on, reported and not enforced. Every `uses:` here is an
  # inline full-length commit SHA, which is what actually decides what runs;
  # `.github/workflows/actions.lock` is committed as preparation for the native lockfile and
  # nothing has yet shown that a runner consults it. Until that evidence exists, a lockfile check
  # cannot be the thing that says this repository is pinned, so it reports and does not gate.
  action-pins:
    name: Self Audit - Action pins
    runs-on: ubuntu-latest
    # The committed lock predates the inline SHAs above and keys its entries on tags, so
    # `--verify-local` has refs it does not account for. That is a fact about the lock's adoption
    # state, not about this commit, and only `gh actions-lock` may resolve it -- the lock is
    # generated, and hand-editing it would make it describe commits nobody resolved.
    continue-on-error: true

    steps:
      - name: Action pins - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Pinned to a commit: an unpinned tool is a poor one to verify pinning with, and
      # `gh extension install --pin` takes only a tag for a binary extension -- a tag the
      # publisher can move under a token-carrying step. Building the extension from a detached
      # checkout of the audited commit is what makes the code that runs here immutable. `gh`
      # itself is preinstalled on the runner image, which the lockfile does not and cannot cover.
      - name: Action pins - Install gh actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          # v0.1.6
          ACTIONS_LOCK_COMMIT: 047fddf38163b304f1e6ef5649f5ac1646edc6a3
        # `gh extension install` takes only `OWNER/REPO` or `.`, and names the extension for the
        # directory it is run in, so the checkout is named for the extension and entered.
        run: |
          git clone --no-checkout https://github.com/github/gh-actions-lock \
            "$RUNNER_TEMP/gh-actions-lock"
          git -C "$RUNNER_TEMP/gh-actions-lock" checkout --detach "$ACTIONS_LOCK_COMMIT"
          go build -C "$RUNNER_TEMP/gh-actions-lock" -o gh-actions-lock ./cmd/gh-actions-lock
          cd "$RUNNER_TEMP/gh-actions-lock" && gh extension install .

      # Offline and needs no token, so it cannot fail for a reason outside the commit under test.
      #
      # Expect it to report the workflow refs above: they are inline SHAs and the committed lock
      # keys its entries on the tags those SHAs were resolved from. What this step is for today is
      # exactly that measurement -- how far the tree is from a lock the tool would accept.
      - name: Action pins - Verify every ref is in the lockfile
        run: gh actions-lock --verify-local --no-fix --no-interactive

      # The other half, and the one that needs the network: a tag that has moved since it was
      # locked, which is what a hijacked release looks like. On the schedule only. Nothing in a
      # contributor's branch can cause it and nothing in their branch can fix it, so it belongs
      # nowhere near their pull request.
      - name: Action pins - Re-verify every pin upstream
        if: github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh actions-lock --verify --no-fix --no-interactive

      - name: Action pins - Summary
        if: always()
        env:
          OUTCOME: ${{ job.status }}
        run: |
          {
            echo "## Self Audit - Action pins"
            echo ""
            echo "Result: **$OUTCOME**"
            echo ""
            echo "What \`.github/workflows/actions.lock\` accounts for. Reported, not enforced:"
            echo "every \`uses:\` in the tree carries an inline full-length commit SHA, and the"
            echo "lockfile is committed as preparation for the native pinning path."
          } >> "$GITHUB_STEP_SUMMARY"
