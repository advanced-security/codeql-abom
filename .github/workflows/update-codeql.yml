# This workflow is managed by gh actions-lock.

name: Update CodeQL CLI

on:
  workflow_dispatch:
    inputs:
      target_version:
        description: 'Target CodeQL CLI version (e.g. v2.26.5). Empty uses the latest release.'
        required: false
        type: string
  schedule:
    - cron: '30 5 * * *'

permissions:
  contents: read

jobs:
  # A pack tracks the CLI it is compiled for, so a CLI release is a version bump for every pack
  # here, for the suites that pin upstream, and for the lock files.
  detect:
    name: Detect CodeQL CLI Update
    runs-on: ubuntu-latest

    outputs:
      current: ${{ steps.check.outputs.current }}
      latest: ${{ steps.check.outputs.latest }}
      needed: ${{ steps.check.outputs.needed }}

    steps:
      - name: Detect - Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Detect - Compare against the latest release
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET: ${{ github.event.inputs.target_version }}
        run: |
          current=$(tr -d '[:space:]' <.codeql-version)
          current=${current#v}

          target=$(echo "${TARGET}" | tr -d '[:space:]')
          if [ -n "${target}" ]; then
            latest=${target#v}
            if ! gh release view "v${latest}" --repo github/codeql-cli-binaries \
                 --json tagName >/dev/null 2>&1; then
              echo "::error::v${latest} is not a github/codeql-cli-binaries release"
              exit 1
            fi
          else
            tag=$(gh release list --repo github/codeql-cli-binaries \
                  --json 'tagName,isLatest' --jq '.[] | select(.isLatest) | .tagName')
            # An empty answer means the API changed shape, not that we are up to date.
            if [ -z "${tag}" ]; then
              echo "::error::could not determine the latest CodeQL CLI release"
              exit 1
            fi
            latest=${tag#v}
          fi

          echo "current=${current}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          if [ "${latest}" != "${current}" ]; then
            echo "needed=true" >> "$GITHUB_OUTPUT"
          else
            echo "needed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Detect - Summary
        env:
          CURRENT: ${{ steps.check.outputs.current }}
          LATEST: ${{ steps.check.outputs.latest }}
          NEEDED: ${{ steps.check.outputs.needed }}
        run: |
          {
            echo "## CodeQL CLI Update Check"
            echo ""
            if [ "${NEEDED}" = "true" ]; then
              echo "Update available: ${CURRENT} -> ${LATEST}"
            else
              echo "CodeQL CLI is already up to date at ${CURRENT}."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  # On the nightly schedule an upgrade branch may already carry review commits on top of the
  # bot's push. Re-running would force over them, so the run stops instead.
  existing-branch:
    name: Check for an Existing Upgrade Branch
    needs: detect
    if: needs.detect.outputs.needed == 'true'
    runs-on: ubuntu-latest

    outputs:
      exists: ${{ steps.look.outputs.exists }}

    steps:
      - name: Branch - Look it up on origin
        id: look
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: 'codeql/upgrade-to-v${{ needs.detect.outputs.latest }}'
          EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "${EVENT_NAME}" = "workflow_dispatch" ]; then
            echo "Manual dispatch, so the branch check is skipped."
            echo "exists=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if gh api "repos/${GITHUB_REPOSITORY}/branches/${BRANCH}" --silent >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Branch - Summary
        env:
          BRANCH: 'codeql/upgrade-to-v${{ needs.detect.outputs.latest }}'
          EXISTS: ${{ steps.look.outputs.exists }}
        run: |
          {
            echo "## Upgrade Branch Preflight"
            echo ""
            if [ "${EXISTS}" = "true" ]; then
              echo "Branch \`${BRANCH}\` already exists, so the pipeline stops to preserve its commits."
              echo "Dispatch this workflow manually to force a refresh."
            else
              echo "Branch \`${BRANCH}\` does not exist, so the pipeline proceeds."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  upgrade:
    name: Upgrade and Open a Pull Request
    needs: [detect, existing-branch]
    if: needs.detect.outputs.needed == 'true' && needs.existing-branch.outputs.exists != 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Upgrade - Checkout repository
        uses: actions/checkout@v7.0.1

      # setup-codeql installs whatever .codeql-version names, so the pin moves first.
      - name: Upgrade - Pin the new CLI version
        env:
          LATEST: ${{ needs.detect.outputs.latest }}
        run: printf 'v%s\n' "${LATEST}" > .codeql-version

      - name: Upgrade - Setup CodeQL
        uses: $/.github/actions/setup-codeql

      - name: Upgrade - Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod

      - name: Upgrade - Setup .NET
        uses: actions/setup-dotnet@v6.0.0
        with:
          dotnet-version: '10.0.x'

      # For `make js`, `style` and `e2e`; the harness refuses to install under a Node below 24.
      - name: Upgrade - Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version-file: '.node-version'

      - name: Upgrade - Update version in all files
        env:
          LATEST: ${{ needs.detect.outputs.latest }}
        run: ./scripts/update-release-version.sh "${LATEST}"

      - name: Upgrade - Upgrade CodeQL pack dependencies
        id: packs
        run: ./scripts/upgrade-packs.sh

      # The version lint-go.yml runs, so this run and pull requests agree on what is clean.
      - name: Upgrade - Install golangci-lint
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.11.4

      # Same commit as self-audit.yml, which says why it is a commit and not a tag.
      - name: Upgrade - Install gh actions-lock
        env:
          GH_TOKEN: ${{ github.token }}
          # v0.1.6
          ACTIONS_LOCK_COMMIT: 047fddf38163b304f1e6ef5649f5ac1646edc6a3
        run: |
          git clone --no-checkout https://github.com/github/gh-actions-lock \
            "$RUNNER_TEMP/gh-actions-lock"
          git -C "$RUNNER_TEMP/gh-actions-lock" checkout --detach "$ACTIONS_LOCK_COMMIT"
          go build -C "$RUNNER_TEMP/gh-actions-lock" -o gh-actions-lock ./cmd/gh-actions-lock
          cd "$RUNNER_TEMP/gh-actions-lock" && gh extension install .

      # `make e2e` installs the harness itself, but never the pinned browser or its libraries.
      - name: Upgrade - Install the end-to-end harness and its browser
        working-directory: ui/tests/e2e
        run: |
          npm ci --no-fund --no-audit
          npx playwright install --with-deps chromium

      # Graphviz is a requirement: serve refuses to start without it, and the layout and figure
      # tests fail rather than skip.
      - name: Upgrade - Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends graphviz

      - name: Upgrade - Verify
        run: make verify

      - name: Upgrade - Open a pull request
        uses: peter-evans/create-pull-request@v8.1.1
        with:
          title: 'Upgrade CodeQL CLI to v${{ needs.detect.outputs.latest }}'
          body: |
            Upgrades the CodeQL CLI from `${{ needs.detect.outputs.current }}` to
            `${{ needs.detect.outputs.latest }}`.

            - `.codeql-version` pinned to the new release
            - every pack under `ql/` bumped to match, since a pack tracks the CLI it is compiled for
            - the ql-mcp pins in `internal/runner/printast.go` and `internal/harness/copilot.go`
              moved to the matching ql-mcp release
            - upstream pack dependencies upgraded and lock files refreshed
            - the `version:` pins inside the suites re-pinned from the lock files, and
              `customql.ActionsAll` kept in step with `ql/actions/lib`
            - `make verify` passed, including `check-versions`

            ${{ steps.packs.outputs.skipped && format('**Partial upgrade:** `{0}` kept their previous pins because a dependency is not yet published to the registry. Dispatch this workflow again once it is.', steps.packs.outputs.skipped) || '' }}
          commit-message: 'Upgrade CodeQL CLI to v${{ needs.detect.outputs.latest }}'
          branch: 'codeql/upgrade-to-v${{ needs.detect.outputs.latest }}'
          delete-branch: true

      - name: Upgrade - Summary
        env:
          CURRENT: ${{ needs.detect.outputs.current }}
          LATEST: ${{ needs.detect.outputs.latest }}
          SKIPPED: ${{ steps.packs.outputs.skipped }}
        run: |
          {
            echo "## CodeQL CLI Update Summary"
            echo ""
            echo "Upgraded CodeQL CLI: ${CURRENT} -> ${LATEST}"
            echo ""
            if [ -n "${SKIPPED}" ]; then
              echo "Packs left on their previous pins (unpublished dependency): \`${SKIPPED}\`"
              echo ""
            fi
            ./scripts/update-release-version.sh --check "${LATEST}"
          } >> "$GITHUB_STEP_SUMMARY"
