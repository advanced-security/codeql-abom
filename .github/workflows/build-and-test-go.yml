# This workflow is managed by gh actions-lock.

name: Build and Test - Go

# Every action is pinned by `.github/workflows/actions.lock`, not by the ref written here. The
# runner resolves each `uses:` through that lockfile to the commit it records, so a tag its
# owner repoints does not change what runs. Never hand-edit a ref: `gh actions-lock` owns both
# files and rewrites an inline SHA back to the tag it keys on.

on:
  pull_request:
    paths:
      - '**/*.go'
      # Fixtures are test input. Without them a regenerated fixture changes what every test
      # asserts and nothing re-runs to say so.
      - '**/testdata/**'
      - 'scripts/**'
      - '.github/workflows/build-and-test-go.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
  push:
    branches: ['main']
    paths:
      - '**/*.go'
      - '**/testdata/**'
      - 'scripts/**'
      - '.github/workflows/build-and-test-go.yml'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'

permissions:
  contents: read

jobs:
  checks:
    name: Build and Test - Checks
    runs-on: ubuntu-latest

    steps:
      - name: Build and Test - Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build and Test - Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # First, because a duplicated package clause reads as a syntax error everywhere else and
      # sends the reader looking in the wrong place.
      - name: Build and Test - Check for corrupted writes
        run: make check-corrupt

      - name: Build and Test - Check formatting
        run: make fmt

      - name: Build and Test - Vet
        run: make vet

      - name: Build and Test - Test the scripts
        run: make script-test

      - name: Build and Test - Build the binary
        run: make build

  sqlite:
    name: Build and Test - Go (SQLite)
    runs-on: ubuntu-latest

    steps:
      - name: Build and Test - Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build and Test - Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Graphviz is a requirement: serve refuses to start without it, and the layout and figure
      # tests fail rather than skip.
      - name: Build and Test - Install Graphviz
        run: sudo apt-get update && sudo apt-get install --yes --no-install-recommends graphviz

      - name: Build and Test - Run tests
        run: make test-sqlite

  postgres:
    name: Build and Test - Go (PostgreSQL)
    runs-on: ubuntu-latest

    steps:
      - name: Build and Test - Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Build and Test - Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      # Docker is a requirement: the store suite runs on a PostgreSQL primary and physical standby in
      # containers, and fails rather than skips without a daemon. Ubuntu runners have one.
      - name: Build and Test - Run tests
        run: make test-postgres

  # One name to require in branch protection, whichever jobs the run is split into.
  build-and-test-go:
    name: Build and Test - Go
    runs-on: ubuntu-latest
    needs: [checks, sqlite, postgres]
    if: always()

    steps:
      - name: Build and Test - Summary
        env:
          CHECKS: ${{ needs.checks.result }}
          SQLITE: ${{ needs.sqlite.result }}
          POSTGRES: ${{ needs.postgres.result }}
        run: |
          {
            echo "## Go"
            echo ""
            echo "- Checks (corrupted writes, gofmt, vet, scripts, build): $CHECKS"
            echo "- \`go test ./... -race\` with the store on SQLite: $SQLITE"
            echo "- Replica routing on a PostgreSQL physical standby, and the store suite on PostgreSQL: $POSTGRES"
          } >> "$GITHUB_STEP_SUMMARY"
          for result in "$CHECKS" "$SQLITE" "$POSTGRES"; do
            [ "$result" = success ] || { echo "a Go job did not succeed: $CHECKS $SQLITE $POSTGRES"; exit 1; }
          done
