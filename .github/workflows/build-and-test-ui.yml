name: Build and Test - Interface

on:
  pull_request:
    paths:
      - '.github/workflows/build-and-test-ui.yml'
      - '.node-version'
      - 'Makefile'
      # The populated run is only as good as what it runs against, and both of these decide that:
      # a recorded fixture is what the database is built from, and the builder is what reads it.
      - 'cmd/abom-corpus/**'
      # The browser suite asserts the server's API contract as the page exercises it, so a change
      # here can break the interface without touching a file under ui/.
      - 'internal/serve/**'
      - 'testdata/corpus/**'
      - 'ui/**'
  push:
    branches: ['main']
    paths:
      - '.github/workflows/build-and-test-ui.yml'
      - '.node-version'
      - 'Makefile'
      - 'cmd/abom-corpus/**'
      - 'internal/serve/**'
      - 'testdata/corpus/**'
      - 'ui/**'

permissions:
  contents: read

jobs:
  build-and-test-ui:
    name: Build and Test - Interface
    runs-on: ubuntu-latest

    steps:
      - name: Interface - Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Interface - Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.node-version'
          cache: 'npm'
          # The only npm dependency in the repository, and it does not live at the root.
          cache-dependency-path: ui/tests/e2e/package-lock.json

      # The browser code carries a third of the interface's behavior and no compiler checks it.
      - name: Interface - Test the browser code
        run: make js

      # Visual drift passes every other check in this workflow.
      - name: Interface - Check style
        run: make style

      - name: Interface - Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: '10.0.x'

      # Keyed on the project files rather than a lock file, because this repository has no
      # packages.lock.json: restore resolves MudBlazor and the WebAssembly runtime every run
      # otherwise.
      - name: Interface - Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('ui/**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-

      - name: Interface - Build
        run: make ui

      # A Razor build proves the markup parses and nothing about what it renders.
      - name: Interface - Test components
        run: make ui-test

      # Geometry, the boot path and the API contract as the page actually exercises it. None of
      # the steps above can see any of it: bUnit has no CSS engine, and a grid that overflows by
      # 288px is green everywhere until a browser lays it out.
      #
      # Go is here only because `make e2e` builds the server the suite drives — and it builds it
      # twice, once per run, so the build cache is worth keeping.
      - name: Interface - Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Interface - Install the browser suite
        working-directory: ui/tests/e2e
        run: npm ci --no-fund --no-audit

      # The browser is ~130 MiB and the lock file pins which one, so the key is the lock file.
      # The install step below still runs: `--with-deps` installs shared libraries through apt,
      # which no cache here covers, and it skips the download when the browser is already there.
      - name: Interface - Cache the pinned browser
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('ui/tests/e2e/package-lock.json') }}

      # `--with-deps` because a GitHub runner has none of Chromium's shared libraries. The suite
      # falls back to a system browser when this is missing or half-extracted, but CI should run
      # the pinned build so every run is the same one.
      - name: Interface - Install the pinned browser
        working-directory: ui/tests/e2e
        run: npx playwright install --with-deps chromium

      - name: Interface - Browser suite
        run: make e2e

      # The same suite against a populated database, which is a different question: the run above
      # answers "does this work where nobody has crawled anything", and this one reaches every
      # assertion an empty database skips. Every product defect found in the cycle that built this
      # was invisible to the empty run — a prune offering everything, a Dashboard counting nodes
      # under the wrong word, a grid putting its sorted column off screen.
      #
      # Offline by construction: `make corpus` replays recorded CodeQL output, so this needs no
      # CLI, no network and no token. Both runs gate, because neither substitutes for the other.
      - name: Interface - Browser suite against the shared data set
        run: make e2e-corpus

      - name: Interface - Summary
        run: |
          {
            echo "## Interface"
            echo ""
            echo "- Browser module tests passed"
            echo "- Style check passed"
            echo "- Blazor build succeeded"
            echo "- Component tests passed"
            echo "- Browser suite passed, empty and populated"
          } >> "$GITHUB_STEP_SUMMARY"
