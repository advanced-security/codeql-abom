# This workflow is managed by gh actions-lock.

name: Query Unit Tests

on:
  pull_request:
    paths:
      - '.codeql-version'
      - '.github/actions/setup-codeql/action.yml'
      - '.github/workflows/query-unit-tests.yml'
      - 'ql/**'
      # What check-versions reads besides the packs, and the scripts that write versions.
      - 'internal/customql/customql.go'
      - 'internal/harness/copilot.go'
      - 'internal/runner/printast.go'
      - 'scripts/*version*.sh'
  push:
    branches: ['main']
    paths:
      - '.codeql-version'
      - '.github/actions/setup-codeql/action.yml'
      - '.github/workflows/query-unit-tests.yml'
      - 'ql/**'
      - 'internal/customql/customql.go'
      - 'internal/harness/copilot.go'
      - 'internal/runner/printast.go'
      - 'scripts/*version*.sh'

permissions:
  contents: read

jobs:
  # No CodeQL needed: pins are text, and a release candidate's suffix leaking into one is caught
  # here rather than at release time.
  versions:
    name: Query Unit Tests - Versions
    runs-on: ubuntu-latest

    steps:
      - name: Versions - Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Versions - Check
        run: make check-versions check-release-version

  query-unit-tests:
    name: Query Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Query Unit Tests - Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Query Unit Tests - Setup CodeQL
        uses: $/.github/actions/setup-codeql

      - name: Query Unit Tests - Run
        run: make ql

      - name: Query Unit Tests - Summary
        run: echo "## Query Unit Tests - all passed" >> "$GITHUB_STEP_SUMMARY"
