# This workflow is managed by gh actions-lock.

name: Lint - Go

on:
  pull_request:
  push:
    branches: ['main', 'next']

permissions:
  contents: read

jobs:
  lint-go:
    name: Lint - Go
    runs-on: ubuntu-26.04

    steps:
      - name: Lint - Checkout repository
        uses: actions/checkout@v7.0.1

      - name: Lint - Setup Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version-file: go.mod
          cache: true

      - name: Lint - Run golangci-lint
        uses: golangci/golangci-lint-action@v9.3.0
        with:
          # Matched to what a developer runs, or the two disagree about what "clean" means.
          version: v2.11.4

      - name: Lint - Summary
        run: echo "## Lint - golangci-lint clean" >> "$GITHUB_STEP_SUMMARY"
