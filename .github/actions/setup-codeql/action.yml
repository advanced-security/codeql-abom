name: 'Setup CodeQL'
description: 'Install the CodeQL CLI at the version pinned in .codeql-version, with the stub on PATH.'

inputs:
  install-packs:
    description: 'Install the query packs this repository depends on.'
    required: false
    default: 'true'
  enable-cache:
    description: >-
      Restore and save the CodeQL install cache. Set to false for release workflows: a
      feature-branch contributor can populate a cache a later job would restore.
    required: false
    default: 'true'

runs:
  using: 'composite'
  steps:
    - name: Setup CodeQL - Read the pinned version
      id: version
      shell: bash
      run: echo "codeql=$(cat .codeql-version)" >> "$GITHUB_OUTPUT"

    - name: Setup CodeQL - Restore the CLI cache
      if: inputs.enable-cache == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.local/share/gh/extensions
        key: gh-codeql-${{ runner.os }}-${{ steps.version.outputs.codeql }}

    # The packs upstream of ours, which `pack install` fetches from the registry every run
    # otherwise. Keyed on the lock files because they record exactly which versions resolved, and
    # on the CLI version because a pack is compiled against one.
    - name: Setup CodeQL - Restore the query pack cache
      if: inputs.enable-cache == 'true' && inputs.install-packs == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.codeql/packages
        key: >-
          codeql-packs-${{ runner.os }}-${{ steps.version.outputs.codeql }}-${{
          hashFiles('ql/**/codeql-pack.lock.yml') }}
        restore-keys: codeql-packs-${{ runner.os }}-${{ steps.version.outputs.codeql }}-

    - name: Setup CodeQL - Install the CLI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        # Through the environment rather than interpolated into the script: the value is the
        # contents of a file in the tree being analyzed, so on a pull request a contributor
        # chooses it. `actions/code-injection` reports the interpolated form, correctly.
        CODEQL_VERSION: ${{ steps.version.outputs.codeql }}
      run: |
        gh extension install github/gh-codeql --force
        gh codeql set-version "$CODEQL_VERSION"
        # `make ql` and the selfcheck subcommand invoke `codeql` directly, not through gh.
        # install-stub takes the target directory positionally; it has no --path flag.
        gh codeql install-stub /usr/local/bin
        codeql version --format=terse

    - name: Setup CodeQL - Install query packs
      if: inputs.install-packs == 'true'
      shell: bash
      # Every pack in the workspace, found rather than listed. A hand-written list is only as
      # current as the last person who remembered it, and the pack it forgets fails much later:
      # `database analyze` resolves the local pack off the search path, then reports its *upstream*
      # dependency as missing -- "The QL pack 'codeql/go-queries@1.6.10' cannot be found" -- which
      # reads as a broken suite rather than as a pack nobody installed. That is how the Go, C# and
      # JavaScript self-audit jobs failed on PR #3 while the Actions job, whose packs were listed,
      # passed.
      #
      # `pack install` takes a single pack directory; it has no recursive mode.
      run: |
        manifests=$(find ql -name codeql-pack.yml | sort)
        if [ -z "$manifests" ]; then
          echo "::error::no CodeQL packs found under ql/; nothing was installed"
          exit 1
        fi
        while IFS= read -r manifest; do
          echo "::group::codeql pack install $(dirname "$manifest")"
          codeql pack install "$(dirname "$manifest")"
          echo "::endgroup::"
        done <<< "$manifests"
