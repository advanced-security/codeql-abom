name: 'ABOM code scanning'

## This CodeQL config file is pointed to by `github-codeql-config-file` repository property
## such that Code Scanning uses this config for Default Setup.

## What is excluded via `paths-ignore` config, and why each one is test code rather than an
## inconvenient finding.
##
## `**/testdata/**` is every fixture tree, and it is the one exclusion that is not about
## convenience. `testdata/corpus` holds ~290 workflows imported from github/codeql's own Actions
## query tests: they exist to *be* findings, and analyzing them would report someone else's
## deliberate test cases as ABOM's own code. Measured 2026-09-19: 341 Actions files sit under it.
##
## Recursive on purpose. `testdata/**` matches the tree at the root and nothing else — measured,
## it still extracted `internal/expand/testdata/sparse/action.yml`, because the pattern is
## anchored where the analysis started. `**/testdata/**` covers both, and covers a file placed
## directly in one of them.
##
## `ui/tests` is the Playwright harness. `ui/tests/e2e/browser.mjs` reads
## PLAYWRIGHT_BROWSERS_PATH and stats the directory it names, which is `js/path-injection` three
## times over and is also the entire feature: an operator points the suite at a browser cache.
##
## `**/*.test.js` is the Node unit suite that lives beside the browser code it tests, because
## `make js` runs `node --test ui/wwwroot/js/*.test.js`. `theme.test.js` evaluates theme.js with
## `new Function`, which is `js/code-injection` at critical severity. theme.js is deliberately a
## plain script -- index.html loads it before Blazor exists so the page does not paint in the
## wrong scheme -- so there is no module to import and evaluating the source is the only way to
## reach it from Node.
##
## Narrow on purpose. No pattern here reaches a line that is served to anyone, and nothing that
## ships is excluded. Path filters apply to the languages CodeQL extracts from source, so this
## has no effect on the Go and C# analyses; a finding in either still has to be answered.
##
## `ui/bin` and `ui/obj` are .NET build output -- the generated WebAssembly runtime, none of it
## ours. Without this the JavaScript answer would depend on whether the tree happened to have been
## built: `make quality` runs the C# pass first, which builds, and a fresh checkout has not. A gate
## that says something different once you have compiled is not one.
##
## These are resolved against the source root the analysis was given, so selfcheck has to pass the
## same root Default Setup uses or they match nothing at all.
##
## `ql/**/test/**` is the CodeQL query test fixtures, and it is `**/testdata/**`'s reason again:
## a fixture exists to *be* a finding. Only composite actions leak in, because the extractor
## includes `**/action.yml` recursively while `.github/workflows/*.yml` is anchored at the source
## root -- so a nested fixture workflow is invisible and a nested fixture `action.yml` is not.
## Measured 2026-09-20: `ql/actions/graph-extraction/test/AbomEdges/.github/actions/greet/`
## supplied the only two `abom/actions/uncovered-action-ref` findings in the whole repository.
##
paths-ignore:
  - 'ui/tests'
  - 'ui/bin'
  - 'ui/obj'
  - '**/testdata/**'
  - 'ql/**/test/**'
  - '**/*.test.js'
  - '**/*.test.mjs'
