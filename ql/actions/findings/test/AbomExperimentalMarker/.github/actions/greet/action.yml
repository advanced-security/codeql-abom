name: Greet
description: A composite action, which has no jobs and would produce nothing from a job-only query.

inputs:
  who-to-greet:
    description: Who to greet
    required: true
    default: World

runs:
  using: composite
  steps:
    # Through env rather than interpolated into the script: an input reaching `run:` directly is
    # code injection, and this fixture exists to be a composite action with no jobs, not to be a
    # vulnerable one. The self-audit reads this tree like any other.
    - run: echo "Hello $WHO_TO_GREET"
      shell: bash
      env:
        WHO_TO_GREET: ${{ inputs.who-to-greet }}
