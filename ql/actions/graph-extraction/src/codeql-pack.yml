# semver orders 2.26.4-next.1 before 2.26.4.
version: 2.26.4
description: 'Extraction queries for the Actions Bill of Materials (ABOM)'
library: false
suites: codeql-suites
dependencies:
  codeql/actions-all: 0.6.0
