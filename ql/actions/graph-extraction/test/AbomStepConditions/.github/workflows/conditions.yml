name: Conditions
on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Only on main
        if: github.ref == 'refs/heads/main'
        run: echo "releasing"
      - name: Always
        run: echo "always"
      - name: Only on failure
        if: failure()
        uses: actions/upload-artifact@v4
