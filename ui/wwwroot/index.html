<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ABOM — Actions Bill of Materials</title>
    <base href="/" />
    <link rel="stylesheet" href="_content/MudBlazor/MudBlazor.min.css" />
    <link rel="stylesheet" href="css/app.css" />
    <link rel="stylesheet" href="css/tutorial.css" />
    <link rel="icon" href="data:," />
    <link rel="preload" id="webassembly" />
    <script type="importmap"></script>
    <script>
        // Resolve the scheme before first paint, or the app flashes light before Blazor loads.
        (function () {
            var saved = null;
            try { saved = localStorage.getItem('abom.theme'); } catch (e) { /* private mode */ }
            var dark = saved === 'dark' ||
                ((!saved || saved === 'system') &&
                    window.matchMedia('(prefers-color-scheme: dark)').matches);
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
        })();
    </script>
</head>

<body>
    <div id="app">
        <div class="abom-boot">
            <div class="abom-boot-mark">ABOM</div>
            <div class="abom-boot-text">Reading the Actions Bill of Materials…</div>
        </div>
    </div>

    <div id="blazor-error-ui">
        An unexpected error has occurred.
        <a href="" class="reload">Reload</a>
        <a class="dismiss">🗙</a>
    </div>

    <!-- Shown by js/build.js when the server now serves a newer build than this page is running. -->
    <div id="abom-stale-build" role="status" hidden>
        <span>This page is running an earlier build of ABOM than the server now serves, so what the server added since is not here yet.</span>
        <button type="button" title="Reload this page to run the build the server serves now.">Reload</button>
    </div>

    <!-- Vendored rather than fetched from a CDN so the interface works offline and its supply
         chain is a file we can point at. Recorded here because a tool that builds bills of
         materials should be able to answer this question about itself:
           three.min.js         Three.js, MIT, Copyright 2010-2022 Three.js Authors
           3d-force-graph.min.js  v1.73.4, MIT, https://github.com/vasturiano/3d-force-graph

         Both are loaded on purpose, and the browser's "Multiple instances of Three.js" warning is
         expected: 3d-force-graph bundles its own copy, and node geometry is built from the
         standalone one. Geometry crosses between the two copies because it is plain typed-array
         data; materials do not, which `js/appearance.js` explains and works around. Dropping
         either script removes node shapes. -->
    <script src="js/three.min.js"></script>
    <script src="js/3d-force-graph.min.js"></script>
    <script src="js/theme.js"></script>
    <script src="js/tutorial.js"></script>
    <script src="js/tipfit.js"></script>
    <!-- After every first-party script, which it watches for change by the tags parsed so far. -->
    <script src="js/build.js"></script>
    <script src="_content/MudBlazor/MudBlazor.min.js"></script>
    <script src="_framework/blazor.webassembly#[.{fingerprint}].js"></script>
</body>

</html>
